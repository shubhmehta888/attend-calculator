<!DOCTYPE html>
<html>

<head>
    <title>Attend</title>
    <link rel="stylesheet" href="styleeproject.css">
</head>

<body>

    <nav>
        <h2>Attend</h2>

        <div class="navbar">
            <a href="#home">Home</a>
            <a href="#calculator">Calculator</a>
            <a href="#recovery">Recovery</a>
            <a href="#tips">Tips</a>
        </div>
    </nav>

    <section id="home" class="home">

        <h1>Check your attendance</h1>

      

        <a href="#calculator">
            <button>Check Now</button>
        </a>

    </section>


    <section id="calculator" class="section">

        <h2>Check Attendance</h2>

        <div class="box">

          

            <label>Total Classes</label>
            <input type="number" id="total" placeholder="50">

            <label>Classes Attended</label>
            <input type="number" id="attended" placeholder="35">

            <label>Required Attendance (%)</label>
            <input type="number" id="target" value="75">

            <button onclick="calculate()">Calculate</button>
            <button onclick="clearResult()">Clear</button>

        </div>

        <div id="result" class="result">

            <h3 id="resultSubject"></h3>

            <h1 id="percentage">--</h1>

            <p id="status"></p>
            <p id="message"></p>

            <p id="missMessage"></p>

        </div>

    </section>


    <section id="recovery" class="section">

        <h2>Attendance Recovery</h2>

        <p>How many classes needed to recover </p>

        <div class="box">

            <label>Total Classes</label>
            <input type="number" id="total" placeholder="50">

            <label>Classes Attended</label>
            <input type="number" id="attended" placeholder="30">

            <label>Target Attendance (%)</label>
            <input type="number" id="target" value="75">

            <button onclick="recover()">Find Out</button>

        </div>

        <div id="recoveryResult" class="result">

            <h3 id="recoveryTitle"></h3>

            <h1 id="classesNeeded"></h1>

            <p id="recoveryMessage"></p>

        </div>

    </section>


    <section id="tips" class="section tips">

        <h2>Tips</h2>

        <ul>
            <li>Attend classes regulary</li>
            <li>Try to keep maximum attendance</li>
            <li>Don't take unnecessary leaves</li>
            
        </ul>

    </section>


    <footer>
        Attend - Check your attendance
    </footer>


    <script src="calculator.js"></script>

</body>

</html>
